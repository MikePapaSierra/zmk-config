# USB is the only host transport. BLE remains enabled solely because the
# stock Corne split uses it to communicate between the left and right halves.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_BATTERY_REPORTING=n
# This drives the external-power rail that supplies the right half via TRRS.
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
