# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_EXT_POWER=y

# Turn off backlight
CONFIG_ZMK_BACKLIGHT=n

# This is so that the lag on the right side is minimized.
# https://zmk.dev/docs/troubleshooting#connectivity-issues
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Power options
#
# Without a TRRS cable, the halves only communicate over BLE, so the
# peripheral (right) side keeps advertising/reconnecting and never powers
# down on its own, draining the battery much faster than the left side.
# Deep sleep disconnects BLE and cuts power to peripherals after the
# keyboard has been idle, which is the main lever available for battery
# life on a wireless-only split. Waking up (any key press) takes a few
# seconds to reconnect over BLE.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
